# CI — PORTING modules 13/05/12: every push builds the full package on macOS
# and runs the 628-check golden suite; Windows builds the portable core +
# pebserver and runs the 593-check subset (pebsmokecore) against the SAME
# goldens — bit-identical worldgen AND a dedicated-server/guest e2e over
# plain sockets, cross-platform. Both lanes use temp data roots.
# PEBBLE_REGOLD is forbidden in CI: goldens are frozen.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS build + goldens
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: |
          swift --version
          uname -m
          sw_vers
      - name: Refuse regold
        run: |
          if [ -n "${PEBBLE_REGOLD:-}" ]; then
            echo "PEBBLE_REGOLD must never be set in CI"; exit 1
          fi
      - name: Build (release, all targets)
        run: swift build -c release
      - name: Golden suite (hermetic data root)
        run: PEBBLE_DATA_DIR="$RUNNER_TEMP/pebble-data" swift run -c release pebsmoke
      - name: Goldens unmodified
        run: git diff --exit-code goldens/

  windows:
    name: Windows portable core + goldens
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: compnerd/gha-setup-swift@v0.4.0
        with:
          swift-version: swift-6.2.1-release
          swift-build: 6.2.1-RELEASE
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: swift --version
      - name: Refuse regold
        shell: bash
        run: |
          if [ -n "${PEBBLE_REGOLD:-}" ]; then
            echo "PEBBLE_REGOLD must never be set in CI"; exit 1
          fi
      - name: Build the portable golden suite (release)
        run: swift build -c release --product pebsmokecore
      # the same frozen goldens as macOS — passing here proves a Windows
      # Pebble generates bit-identical worlds (PORTING module 13)
      - name: Deterministic golden suite (hermetic data root)
        run: .\.build\release\pebsmokecore.exe
        env:
          PEBBLE_DATA_DIR: ${{ runner.temp }}\pebble-data
          PEBBLE_GOLDENS_DIR: ${{ github.workspace }}\goldens
      - name: Build the dedicated server (release)
        run: swift build -c release --product pebserver
      # --help must exit 0 without touching storage (PORTING module 12)
      - name: pebserver smoke
        run: .\.build\release\pebserver.exe --help
      - name: Build the Windows client shell (release)
        run: swift build -c release --product PebbleWin
      # downloadable demo for real-hardware testing (PORTING modules 07/09):
      # exe + Swift runtime DLLs; grab it from the run's Artifacts section
      - name: Stage the demo artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item .build\release\PebbleWin.exe stage\Pebble.exe
          $core = (& where.exe swiftCore.dll | Select-Object -First 1)
          Copy-Item (Join-Path (Split-Path -Parent $core) '*.dll') stage\
          New-Item -ItemType Directory -Force -Path stage\assets | Out-Null
          Copy-Item packaging\title-bg.png stage\assets\
          Copy-Item packaging\logo.png stage\assets\
          Copy-Item "packaging\Faithful 32x - 1.20.1.zip" stage\assets\
          Copy-Item "packaging\Faithful 32x - 1.20.1 LICENSE.txt" stage\assets\ -ErrorAction SilentlyContinue
          Set-Content -Path stage\LEES-MIJ.txt -Value "PEBBLE voor Windows (testbuild)`r`n`r`nUITPAKKEN EERST: sleep deze hele map uit de zip (je bureaublad is prima) en`r`nstart Pebble.exe daar. Draai hem NIET vanuit de zip zelf, en haal Pebble.exe`r`nniet los van de rest van de map. Je werelden komen in de map PebbleData die`r`nnaast Pebble.exe ontstaat.`r`n`r`nSTARTEN: dubbelklik Pebble.exe — je krijgt HET ECHTE Pebble-titelscherm,`r`nprecies zoals op de Mac: Singleplayer, Multiplayer, Options, alles werkt.`r`n`r`nEERSTE KEER: Windows vraagt of Pebble op het netwerk mag. Klik TOESTAAN en`r`nzet het vinkje bij 'Particuliere netwerken' aan. Zonder dat kan niemand bij`r`njou binnenkomen en zien jullie elkaars werelden niet in de lijst staan. Kwam`r`ndie vraag niet? Windows-beveiliging > Firewall > Een app toestaan > Pebble.`r`n`r`nSAMEN SPELEN: wie de wereld heeft, drukt in het spel op Esc en kiest`r`n'Open to LAN'. Zitten jullie op hetzelfde wifi, dan verschijnt die wereld`r`nvanzelf bij de ander onder Multiplayer > LAN Games. Klikken en je zit erin.`r`n`r`nLUKT DAT NIET? Op dezelfde knop in het Esc-menu staat een LAN-CODE van`r`ntwaalf tekens, zoals 18A2-NBZ6-VCQ2. Lees hem voor of stuur hem door`r`n(WhatsApp, wat dan ook). De ander kiest Multiplayer, dan 'Join By Code',`r`ntypt hem in, en zit erin. Werkt van Mac naar Windows en andersom, ook als`r`njullie geen vrienden in het spel zijn. Hoofdletters, streepjes en spaties`r`nmaken niet uit.`r`n`r`nBESTURING: zoals altijd — WASD/spatie/shift/ctrl, E inventaris, T chat,`r`nEsc pauze, links slopen, rechts bouwen. Klik in het venster om te spelen.`r`n`r`nSKIN: leg een skin.png (64x64) in de map PebbleData — vrienden zien hem,`r`njij ziet die van hen.`r`n`r`nGELUID: werkt (gesynthetiseerd, geen bestanden).`r`n`r`nPEBBLE DRAAIT AL? Dan staat er nog een oude Pebble open, ook al zie je hem`r`nniet. Sluit die eerst (Ctrl+Shift+Esc, Taakbeheer). Twee keer Pebble op`r`ndezelfde werelden maakt je saves kapot, dus de tweede weigert te starten.`r`n`r`nPROBLEEM? Stuur pebble-log.txt EN pebble-log-prev.txt (allebei naast`r`nPebble.exe) + screenshot (Win+Shift+S). pebble-log-prev.txt is de vorige keer:`r`nals hij crasht en je start opnieuw, staat de crash daarin."
      - uses: actions/upload-artifact@v4
        with:
          name: pebble-windows-demo
          path: stage
      - name: Goldens unmodified
        shell: bash
        run: git diff --exit-code goldens/
